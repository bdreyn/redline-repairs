    heading: ''
    body: |-
      We’re currently building our inventory of used coupes and sedans. Some vehicles are ready to drive; others may need minor work. Check back soon or give us a call to see what’s available.

      Occasionally we have vehicles that need repair or restoration. These can be a great value if you’re handy or want us to get them road-ready for you.
