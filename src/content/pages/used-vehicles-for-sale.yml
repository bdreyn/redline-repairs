    heading: Used Vehicles for Sale in Tyler, TX
    body: |-
      Looking for a reliable used car without the dealership runaround? At Redline Repairs LLC, we now offer a small selection of pre-owned vehicles that have been inspected by the same technicians who repair cars every day.
      Because we see what’s really going on under the hood, we only list vehicles we’re comfortable standing behind. No pressure, no gimmicks — just straightforward cars at fair prices for drivers in Tyler and East Texas.
  - type: richtext
    id: ''
    heading: Why Buy a Used Car from Redline Repairs?
    body: |-
      - Thorough multi-point inspection by our own mechanics
      - Honest condition reports — we tell you what we know
      - Transparent pricing with no hidden fees
      - Local ownership and personal service
      - Convenient location at 6252 Rhones Quarter Rd, Tyler

      Whether you need a daily driver, a work vehicle, or something affordable to get back on the road, we’re here to help.
  - type: richtext
