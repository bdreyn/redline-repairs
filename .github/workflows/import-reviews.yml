name: Import Google Reviews

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/import-reviews.mjs
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_ID: ${{ secrets.GOOGLE_PLACE_ID }}
      - name: Commit new pending reviews
        run: |
          git config user.name "redline-reviews-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/reviews/google-*.yml
          git diff --cached --quiet || git commit -m "chore: import new pending Google reviews [skip ci]"
          git diff --cached --quiet || git push
